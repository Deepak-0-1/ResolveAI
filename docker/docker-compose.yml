services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai -d resolveai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pull models after first start:
    # docker compose exec ollama ollama pull qwen2.5:3b
    # docker compose exec ollama ollama pull nomic-embed-text

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env.example
    environment:
      APP_ENV: development
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://resolveai:resolveai@postgres:5432/resolveai
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
      API_CORS_ORIGINS: http://localhost:8501
      RETRIEVAL_MODE: hybrid
      RATE_LIMIT_PER_MINUTE: "120"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: apps/ui/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
