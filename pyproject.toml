[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolveai"
version = "0.1.0"
description = "Production-oriented AI customer support agent with grounded RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "streamlit>=1.40.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "qdrant-client>=1.12.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "langgraph>=0.2.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]

[project.scripts]
resolveai-seed = "resolveai_db.seed:main"
resolveai-seed-kb = "resolveai_rag.seed_kb:main"
resolveai-eval = "eval.runners.baseline:main"

[tool.hatch.build.targets.wheel]
packages = [
    "resolveai_common",
    "resolveai_api",
    "resolveai_db",
    "resolveai_rag",
    "resolveai_agent",
]

[tool.hatch.build.targets.wheel.force-include]
"packages/common/src/resolveai_common" = "resolveai_common"
"apps/api/src/resolveai_api" = "resolveai_api"
"packages/db/src/resolveai_db" = "resolveai_db"
"packages/rag/src/resolveai_rag" = "resolveai_rag"
"packages/agent/src/resolveai_agent" = "resolveai_agent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    ".",
    "packages/common/src",
    "packages/db/src",
    "packages/rag/src",
    "packages/agent/src",
    "apps/api/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"eval/datasets/build_golden.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "resolveai_common",
    "resolveai_api",
    "resolveai_db",
    "resolveai_rag",
    "resolveai_agent",
]
