name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check packages apps tests eval

      - name: Ruff format check
        run: ruff format --check packages apps tests eval

      - name: Unit and API tests
        run: pytest tests -q --tb=short

      - name: Docker Compose config
        run: docker compose -f docker/docker-compose.yml config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t resolveai-api:ci .

      - name: Build UI image
        run: docker build -f apps/ui/Dockerfile -t resolveai-ui:ci .
